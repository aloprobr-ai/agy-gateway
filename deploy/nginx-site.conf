# Пример сайта nginx + PHP-FPM для шлюза (Linux).
#
# Встроенного сервера PHP (bin/serve.sh) хватает, когда шлюзом пользуетесь вы
# один. Если он должен работать постоянно, быть доступен снаружи или держать
# нескольких клиентов сразу — ставьте его так.
#
# Замените example.com на свой домен, путь — на свой, и получите сертификат
# (certbot --nginx -d example.com). Без https наружу не выставляйте: ключ
# уходит в заголовке Authorization открытым текстом.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Всё, кроме проверки сертификата, — на https.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # ВАЖНО: корень — именно public, а не папка проекта. Иначе наружу
    # окажутся видны config.php с ключами, logs/ и storage/.
    root /srv/agy-gateway/public;
    index index.php;

    client_max_body_size 20m;     # картинки в запросах бывают крупными

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

        # CLI думает дольше обычных веб-таймаутов: без этого nginx оборвёт
        # запрос на 60-й секунде и отдаст 504 раньше, чем придёт ответ.
        # Значение должно быть не меньше cli.timeout из config.php.
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    # Служебное наружу не отдаём — на случай, если корень выставлен неверно.
    location ~* ^/(src|bin|logs|storage|tests|deploy|config\.php|config\.example\.php)(/|$) {
        deny all;
        return 404;
    }

    # Картинки и файлы, сделанные моделью, nginx отдаёт сам.
    location /files/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

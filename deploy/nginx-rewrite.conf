# aaPanel -> ваш сайт -> «Псевдостатика / Rewrite» -> вставить это.
# Файл подключается внутрь server {} и отправляет все несуществующие пути в index.php.

location / {
    try_files $uri $uri/ /index.php$is_args$args;
}

# Служебные файлы наружу не отдаём (на случай, если корень сайта выставлен неверно)
location ~* ^/(src|bin|logs|storage|tests|deploy|config\.php|config\.example\.php)(/|$) {
    deny all;
    return 404;
}

# CLI-бэкенд (agy) думает дольше веб-таймаутов по умолчанию: nginx оборвёт
# запрос через 60 с и отдаст 504 раньше, чем CLI успеет ответить.
# Значения должны быть не меньше cli.max_time из config.php (по умолчанию
# 840 с). Тот же предел нужен в PHP-FPM: request_terminate_timeout в aaPanel
# по умолчанию 100 с, и всё, что думает дольше, PHP-FPM убивает молча.
fastcgi_read_timeout 900s;
fastcgi_send_timeout 900s;
proxy_read_timeout 900s;

# Стриминг (SSE): PHP отдаёт заголовок X-Accel-Buffering: no, и nginx сам
# выключает буферизацию для такого ответа — дополнительных правил не нужно.
# Если стрим всё же приходит «пачкой», проверьте, что в настройках сайта
# не включён gzip для text/event-stream.
